<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador de archivos</title>

<style>
body{
    font-family: Segoe UI, Arial, sans-serif;
    margin:20px;
}

.folder,.file{
    padding:8px;
    cursor:pointer;
    border-radius:4px;
}

.folder:hover,.file:hover{
    background:#f3f3f3;
}

.children{
    margin-left:25px;
    display:none;
}

.children.open{
    display:block;
}
</style>
</head>
<body>

<h2>Repositorio koditorr</h2>

<div id="tree"></div>

<script>

const USER = "gunner666";
const REPO = "koditorr";

async function getContents(path = "") {
    const response = await fetch(
        `https://api.github.com/repos/${USER}/${REPO}/contents/${path}`
    );
    return await response.json();
}

async function buildTree(path, container) {

    const items = await getContents(path);

    items.sort((a,b)=>{
        if(a.type === b.type){
            return a.name.localeCompare(b.name);
        }
        return a.type === "dir" ? -1 : 1;
    });

    for(const item of items){

        if(item.type === "dir"){

            const folder = document.createElement("div");
            folder.className = "folder";
            folder.textContent = "📁 " + item.name;

            const children = document.createElement("div");
            children.className = "children";

            folder.addEventListener("click", async ()=>{

                if(children.childElementCount === 0){
                    await buildTree(item.path, children);
                }

                children.classList.toggle("open");
            });

            container.appendChild(folder);
            container.appendChild(children);

        } else {

            const file = document.createElement("div");
            file.className = "file";
            file.textContent = "📄 " + item.name;

            file.addEventListener("click", ()=>{
                window.open(item.html_url, "_blank");
            });

            container.appendChild(file);
        }
    }
}

buildTree("", document.getElementById("tree"));

</script>

</body>
</html>
